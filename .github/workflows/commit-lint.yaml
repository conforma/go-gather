---
name: Commit Lint

"on":
    pull_request:
        branches:
        - main

permissions:
  contents: read

jobs:

  Commit-Lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job only reads local git history; don't persist the token.
          persist-credentials: false

      - name: Test the validator
        shell: bash
        run: bash hack/check-commit-message_test.sh

      - name: Validate commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "${BASE_SHA}" || -z "${HEAD_SHA}" ]]; then
            echo "::error::Could not determine PR commit range (base='${BASE_SHA}' head='${HEAD_SHA}')"
            exit 1
          fi

          rc=0
          # --no-merges: the PR's own merge commits are exempt and would
          # otherwise be validated as GitHub-generated "Merge ..." messages.
          while read -r sha; do
            [[ -z "${sha}" ]] && continue
            if ! git show -s --format=%B "${sha}" | ./hack/check-commit-message.sh --strict; then
              subject="$(git show -s --format=%s "${sha}")"
              echo "::error::Non-conventional commit ${sha}: ${subject}"
              rc=1
            fi
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")

          if [[ "${rc}" -eq 0 ]]; then
            echo "All commit messages follow Conventional Commits."
          fi
          exit "${rc}"
