name: Release Go-Gather

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Checks"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    # Only release from the canonical repository; forks inherit tags but not
    # releases, so semantic-release would try to re-create an existing tag and
    # fail. See EC-2161.
    if: >-
      github.repository == 'conforma/go-gather' &&
      (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install semantic-release@25.0.3 @semantic-release/github@12.0.6 @semantic-release/commit-analyzer@13.0.1 @semantic-release/release-notes-generator@14.1.0 conventional-changelog-conventionalcommits@9.3.0

      - name: Tag release if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            echo "Running Semantic Release"
            npx semantic-release
